<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ireland 2026">

  <style>
    :root {
      --bg: #06131a;
      --bg-2: #0d1d28;
      --panel: rgba(12, 24, 31, 0.96);
      --panel-soft: rgba(17, 29, 38, 0.9);
      --panel-strong: rgba(8, 18, 24, 0.98);
      --line: rgba(142, 177, 186, 0.18);
      --text: #e8f3f5;
      --muted: #9db4bd;
      --accent: #6fe7d2;
      --accent-2: #5fc4d6;
      --amber: #f2c46d;
      --good: #8ce7c4;
      --danger: #f7c684;
      --shadow: rgba(3, 12, 18, 0.65);
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      background:
        radial-gradient(circle at top, rgba(22, 64, 71, 0.75), transparent 28%),
        linear-gradient(180deg, var(--bg) 0%, #081821 100%);
      color: var(--text);
      font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100vh;
      padding-bottom: 4rem;
    }

    ::-webkit-scrollbar { display: none; }

    .app-shell {
      max-width: 430px;
      margin: 0 auto;
      padding: 0 1rem 1rem;
    }

    .app-main {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(14px);
      background: rgba(7, 18, 24, 0.8);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .topbar-inner {
      max-width: 430px;
      margin: 0 auto;
      padding: 0.9rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 800;
      line-height: 1.2;
      color: var(--accent);
      letter-spacing: 0.02em;
    }

    .brand p {
      margin: 0.25rem 0 0;
      font-size: 0.7rem;
      color: var(--muted);
    }

    .progress-wrap {
      text-align: right;
    }

    .progress-text {
      display: block;
      color: var(--accent);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .progress-bar {
      width: 5.25rem;
      height: 0.5rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--line);
      overflow: hidden;
      margin-top: 0.45rem;
    }

    .progress-fill {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 14px rgba(111, 231, 210, 0.65);
      transition: width 220ms ease;
    }

    .banner {
      margin: 0.85rem auto 0;
      border-radius: 1rem;
      border: 1px solid rgba(111, 231, 210, 0.32);
      background: linear-gradient(135deg, rgba(9, 23, 30, 0.96), rgba(9, 35, 45, 0.95));
      box-shadow: 0 14px 26px rgba(0,0,0,0.12);
      padding: 0.8rem 0.9rem;
    }

    .banner-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .banner-label {
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--accent);
    }

    .banner-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      margin-top: 0.25rem;
    }

    .banner-sub {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.125rem;
    }

    .day-card {
      scroll-margin-top: 10rem; /* Offsets sticky topbar & banner height */
      scroll-margin-bottom: 2rem;
      background: linear-gradient(180deg, rgba(10, 22, 28, 0.96), rgba(6, 17, 23, 0.96));
      border: 1px solid var(--line);
      border-radius: 1.15rem;
      padding: 0.9rem 0.9rem 0.95rem;
      box-shadow: 0 14px 28px rgba(0,0,0,0.12);
      transition: transform 160ms ease, border-color 160ms ease, opacity 160ms ease;
    }

    .day-card.today {
      border-color: rgba(111, 231, 210, 0.48);
      box-shadow: 0 16px 32px rgba(13, 35, 42, 0.32);
    }

    .day-card.priority {
      border-color: rgba(242, 196, 109, 0.42);
    }

    .day-card.past {
      opacity: 0.7;
      border-color: rgba(255,255,255,0.08);
    }

    .day-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--line);
    }

    .day-date {
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .city-name {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.4rem;
      font-size: 1.05rem;
      line-height: 1.2;
      font-weight: 800;
      color: var(--text);
    }

    .day-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      padding: 0.4rem 0.6rem;
      min-width: 4.75rem;
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    .day-pill.today {
      color: var(--accent);
      border-color: rgba(111, 231, 210, 0.25);
      background: rgba(111, 231, 210, 0.08);
    }

    .day-pill.priority {
      color: var(--amber);
      border-color: rgba(242, 196, 109, 0.2);
      background: rgba(242, 196, 109, 0.08);
    }

    .day-pill.past {
      color: var(--muted);
    }

    .weather-block {
      margin-top: 0.9rem;
    }

    .weather-head {
      font-size: 0.64rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 0.55rem;
    }

    .weather-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 0.95rem;
      padding: 0.72rem 0.8rem;
    }

    .weather-main {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      color: var(--text);
    }

    .weather-icon {
      font-size: 1.2rem;
      line-height: 1;
      display: grid;
      place-items: center;
      width: 2rem;
      height: 2rem;
      border-radius: 0.7rem;
      background: rgba(111, 231, 210, 0.08);
    }

    .temp {
      font-size: 1.1rem;
      line-height: 1.1;
      font-weight: 800;
      color: var(--accent);
    }

    .weather-label {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .weather-meta {
      text-align: right;
      font-size: 0.76rem;
      color: var(--text);
      line-height: 1.5;
    }

    .weather-meta strong {
      color: var(--text);
      font-weight: 700;
    }

    .weather-meta span {
      color: var(--muted);
    }

    .forecast-box {
      overflow: hidden;
      margin-top: 0.7rem;
      border-radius: 0.9rem;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
    }

    .forecast-toggle {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.7rem 0.8rem;
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 800;
      cursor: pointer;
      color: var(--muted);
    }

    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.5rem;
      padding: 0.6rem;
    }

    .forecast-day {
      border-radius: 0.8rem;
      background: rgba(8, 18, 24, 0.78);
      border: 1px solid var(--line);
      text-align: center;
      padding: 0.55rem 0.3rem;
    }

    .forecast-day-label {
      font-size: 0.58rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    .forecast-day-icon {
      font-size: 1.05rem;
      line-height: 1;
      display: block;
      margin: 0.35rem 0 0.25rem;
    }

    .forecast-day-high {
      font-size: 0.7rem;
      color: var(--accent);
      font-weight: 800;
    }

    .forecast-day-low {
      font-size: 0.62rem;
      color: var(--muted);
    }

    .trip-meta {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.4rem;
      margin-top: 0.8rem;
      font-size: 0.82rem;
      color: var(--text);
    }

    .hotel-row, .drive-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .hotel-row {
      color: var(--text);
      font-weight: 600;
    }

    .drive-row {
      color: var(--muted);
    }

    .map-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      border: 1px solid rgba(111, 231, 210, 0.28);
      background: rgba(111, 231, 210, 0.08);
      color: var(--accent);
      border-radius: 0.7rem;
      text-decoration: none;
      font-size: 0.7rem;
      padding: 0.42rem 0.6rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    /* Structured Schedule & Timeline UI */
    .schedule-head {
      font-size: 0.64rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      margin-top: 0.9rem;
      margin-bottom: 0.55rem;
    }

    .timeline {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .timeline-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.7rem;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--line);
      border-radius: 0.85rem;
      padding: 0.55rem 0.75rem;
    }

    .timeline-left {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      overflow: hidden;
    }

    .time-badge {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--accent);
      background: rgba(111, 231, 210, 0.1);
      border: 1px solid rgba(111, 231, 210, 0.25);
      padding: 0.25rem 0.55rem;
      border-radius: 0.55rem;
      white-space: nowrap;
    }

    .activity-desc {
      font-size: 0.82rem;
      color: var(--text);
      line-height: 1.35;
    }

    .activity-map-link {
      flex-shrink: 0;
      color: var(--muted);
      font-size: 0.75rem;
      text-decoration: none;
      padding: 0.2rem 0.4rem;
      border-radius: 0.4rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line);
      transition: color 150ms ease, border-color 150ms ease;
    }

    .activity-map-link:hover {
      color: var(--accent);
      border-color: rgba(111, 231, 210, 0.3);
    }

    .scenic, .alert {
      margin-top: 0.8rem;
      border-radius: 0.95rem;
      padding: 0.72rem 0.8rem;
      font-size: 0.82rem;
      line-height: 1.5;
    }

    .scenic {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      color: var(--text);
    }

    .alert {
      border: 1px solid rgba(242, 196, 109, 0.26);
      background: rgba(242, 196, 109, 0.08);
      color: #f5d694;
    }

    .alert strong {
      font-weight: 800;
    }

    /* Notes Area (Custom CSS Replacing Tailwind Utility Classes) */
    .notes-box {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.02);
    }

    .notes-label {
      display: flex;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.25rem;
      color: var(--muted);
      cursor: pointer;
    }

    .notes-input {
      width: 100%;
      padding: 0.5rem;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line);
      color: var(--text);
      font-size: 0.875rem;
      resize: vertical;
    }

    .notes-input:focus {
      outline: none;
    }

    .hidden { display: none !important; }
  </style>
</head>

        alert: "Free Premier Inn airport shuttle. Newgrange tour booked for 9:30 AM.",
        highPriority: false,
        notes: "Jane & Steve overnight at Premier Inn Dublin Airport."
      },
      {
        id: "sep14",
        date: "Mon, Sep 14",
        city: "Departure",
        weatherCity: "Dublin",
        hotel: "Dublin Airport",
        searchQuery: "Dublin Airport Ireland",
        drive: "Airport Shuttle",
        activities: [
          { time: "Afternoon", text: "Afternoon Flights: Jane & Steve", query: "Dublin Airport Ireland" }
        ],
        alert: "Free Premier Inn airport shuttle.",
        highPriority: false,
        notes: "Final departure day."
      }
    ];
    
    const weatherCache = new Map();

    function getWeatherLabel(code) {
      const weatherCodes = {
        0: 'Clear sky', 1: 'Mostly clear', 2: 'Partly cloudy', 3: 'Cloudy',
        45: 'Foggy', 48: 'Depositing rime fog', 51: 'Light drizzle', 53: 'Drizzle',
        55: 'Heavy drizzle', 56: 'Freezing drizzle', 57: 'Heavy freezing drizzle',
        61: 'Light rain', 63: 'Rain', 65: 'Heavy rain', 66: 'Freezing rain',
        67: 'Heavy freezing rain', 71: 'Light snow', 73: 'Snow', 75: 'Heavy snow',
        77: 'Snow grains', 80: 'Rain showers', 81: 'Heavy showers', 82: 'Violent showers',
        85: 'Snow showers', 86: 'Heavy snow showers', 95: 'Thunderstorm',
        96: 'Thunderstorm with hail', 99: 'Severe thunderstorm'
      };
      return weatherCodes[code] || 'Current conditions';
    }

    function getWeatherIcon(code) {
      if (code === 0 || code === 1) return '☀️';
      if (code === 2 || code === 3) return '⛅';
      if ([45, 48].includes(code)) return '🌫️';
      if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return '🌧️';
      if ([71, 73, 75, 77, 85, 86].includes(code)) return '❄️';
      if ([95, 96, 99].includes(code)) return '⛈️';
      return '🌤️';
    }

    // --- Local Storage Persistence Logic ---
    function loadNotes() {
      const savedNotes = localStorage.getItem('irelandTrip2026_notes');
      if (savedNotes) {
        try {
          return JSON.parse(savedNotes);
        } catch (e) {
          console.error("Error parsing saved notes:", e);
          return {}; 
        }
      }
      return {};
    }

    function saveNotes() {
      const notesToSave = itinerary.reduce((acc, day) => {
        acc[day.id] = day.notes || ""; 
        return acc;
      }, {});
      localStorage.setItem('irelandTrip2026_notes', JSON.stringify(notesToSave));
    }

    const itineraryNotes = loadNotes();
    itinerary.forEach(day => {
        if (itineraryNotes[day.id] !== undefined) {
            day.notes = itineraryNotes[day.id];
        }
    });

    document.addEventListener('input', (event) => {
      const target = event.target;
      if (target.tagName === 'TEXTAREA' && target.closest('.notes-box')) {
        const dayId = target.id.replace('note-', '');
        const newNote = target.value;

        const dayToUpdate = itinerary.find(day => day.id === dayId);
        if (dayToUpdate) {
          dayToUpdate.notes = newNote;
          saveNotes();
        }
      }
    });

    // --- Script Functions ---
    async function fetchWeatherForCity(city) {
      try {
        const geocodeUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;
        const geocodeResponse = await fetch(geocodeUrl);
        if (!geocodeResponse.ok) return null;

        const geocodeData = await geocodeResponse.json();
        const location = geocodeData.results && geocodeData.results[0];
        if (!location) return null;

        const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${location.latitude}&longitude=${location.longitude}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=3&temperature_unit=fahrenheit`;
        const weatherResponse = await fetch(weatherUrl);
        if (!weatherResponse.ok) return null;

        const weatherData = await weatherResponse.json();
        const current = weatherData.current || {};
        const daily = weatherData.daily || {};
        const code = current.weather_code;
        const windMph = Math.round((current.wind_speed_10m ?? 0) * 0.621371);

        const forecast = (daily.time || []).slice(0, 3).map((dateStr, index) => {
          const codeForDay = daily.weather_code?.[index];
          const maxTemp = Math.round(daily.temperature_2m_max?.[index] ?? 0);
          const minTemp = Math.round(daily.temperature_2m_min?.[index] ?? 0);

          return {
            label: new Date(dateStr).toLocaleDateString('en-US', { weekday: 'short' }),
            icon: getWeatherIcon(codeForDay),
            max: maxTemp,
            min: minTemp
          };
        });

        return {
          temp: Math.round(current.temperature_2m ?? 0),
          feelsLike: Math.round(current.apparent_temperature ?? 0),
          wind: windMph,
          label: getWeatherLabel(code),
          icon: getWeatherIcon(code),
          forecast
        };
      } catch (error) {
        return null;
      }
    }

    async function hydrateWeather() {
      const cities = [...new Set(itinerary.map(day => day.weatherCity || day.city))];

      for (const city of cities) {
        if (!weatherCache.has(city)) {
          weatherCache.set(city, { loading: true });
          render();
        }

        const result = await fetchWeatherForCity(city);
        weatherCache.set(city, result || { unavailable: true });
        render();
      }
    }

    function getCurrentDate() {
      const override = new URLSearchParams(window.location.search).get('mockDate');
      if (override) return new Date(override);
      return new Date();
    }

    function getDayDate(day) {
      const dateText = day.date.replace(/^[A-Za-z]{3},\s*/, '');
      const [monthName, dayNumber] = dateText.split(' ');
      const monthIndex = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'].indexOf(monthName);
      if (monthIndex === -1) return null;
      const year = getCurrentDate().getFullYear();
      return new Date(year, monthIndex, Number(dayNumber));
    }

    function getNextUpDay() {
      const today = new Date(getCurrentDate().setHours(0, 0, 0, 0));
      const upcoming = itinerary.find((day) => {
        const date = getDayDate(day);
        return date && date >= today;
      });

      if (upcoming) return upcoming;

      const latest = [...itinerary].reverse().find((day) => {
        const date = getDayDate(day);
        return date && date <= today;
      });

      return latest || itinerary[0];
    }

    function renderNextUpBanner() {
      const banner = document.getElementById('next-up-banner');
      if (!banner) return;

      const nextUp = getNextUpDay();
      const nextUpDate = getDayDate(nextUp);
      const isPast = nextUpDate && nextUpDate < new Date(getCurrentDate().setHours(0, 0, 0, 0));
      const isComplete = isPast && nextUp.id === itinerary[itinerary.length - 1].id;

      if (isComplete) {
        banner.innerHTML = `
          <div class="banner-inner">
            <div>
              <div class="banner-label">Trip status</div>
              <div class="banner-title">All set — trip complete</div>
            </div>
            <div style="font-size: 1.5rem;">✅</div>
          </div>
        `;
        return;
      }

      banner.innerHTML = `
        <div class="banner-inner">
          <div>
            <div class="banner-label">Next up</div>
            <div class="banner-title">${nextUp.date} • ${nextUp.city}</div>
            <div class="banner-sub">${nextUp.drive}</div>
          </div>
          <div style="font-size: 1.5rem;">➡️</div>
        </div>
      `;
    }

    function scrollToCurrentDay() {
      const currentDay = getNextUpDay(); // Finds today or the next upcoming day
      if (!currentDay) return;

      const cardElement = document.getElementById(`card-${currentDay.id}`);
      if (cardElement) {
        cardElement.scrollIntoView({
          behavior: 'smooth',
          block: 'center'
        });
      }
    }

    function renderActivities(day) {
      if (Array.isArray(day.activities)) {
        return `
          <div class="schedule-head">Schedule & Activities</div>
          <div class="timeline">
            ${day.activities.map(act => {
              const queryTerm = act.query || `${act.text} ${day.city} Ireland`;
              const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(queryTerm)}`;
              return `
                <div class="timeline-item">
                  <div class="timeline-left">
                    <span class="time-badge">⏰ ${act.time}</span>
                    <span class="activity-desc">${act.text}</span>
                  </div>
                  <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="activity-map-link" title="Open in Google Maps">📍</a>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }
      return `<div class="activities">${day.activities.replace(/\n/g, '<br>')}</div>`;
    }

    function render() {
      const container = document.getElementById("app");
      let completedCount = 0;

      container.innerHTML = itinerary.map((day) => {
        const date = getDayDate(day);
        const isDone = !!(date && date < new Date(getCurrentDate().setHours(0, 0, 0, 0)));
        if (isDone) completedCount++;

        const isToday = date && date.getTime() === new Date(getCurrentDate().setHours(0, 0, 0, 0)).getTime();
        const dayTypeLabel = isToday ? 'Today' : isDone ? 'Past' : 'Upcoming';

        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(day.searchQuery)}`;
        const weatherKey = day.weatherCity || day.city;
        const weather = weatherCache.get(weatherKey) || null;
        const forecastStrip = !weather || weather.loading || weather.unavailable || !weather.forecast?.length
          ? ''
          : `
            <div class="forecast-box">
              <button type="button" class="forecast-toggle" data-forecast-toggle="${day.id}">
                <span>3-day forecast</span>
                <span data-forecast-chevron="${day.id}">▾</span>
              </button>
              <div class="forecast-grid hidden" data-forecast-panel="${day.id}">
                ${weather.forecast.map((item) => `
                  <div class="forecast-day">
                    <div class="forecast-day-label">${item.label}</div>
                    <span class="forecast-day-icon">${item.icon}</span>
                    <div class="forecast-day-high">${item.max}°</div>
                    <div class="forecast-day-low">${item.min}°</div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;

        const weatherBlock = !weather || weather.loading
          ? '<div class="weather-card"><div class="weather-label">Loading weather…</div></div>'
          : weather.unavailable
            ? '<div class="weather-card"><div class="weather-label">Weather unavailable right now</div></div>'
            : `
              <div class="weather-card">
                <div class="weather-main">
                  <span class="weather-icon">${weather.icon}</span>
                  <div>
                    <div class="temp">${weather.temp}°F</div>
                    <div class="weather-label">${weather.label}</div>
                  </div>
                </div>
                <div class="weather-meta">
                  <div><strong>Feels ${weather.feelsLike}°F</strong></div>
                  <div><span>Wind ${weather.wind} mph</span></div>
                </div>
              </div>
              ${forecastStrip}
            `;

        return `
          <div id="card-${day.id}" class="day-card ${isToday ? 'today' : isDone ? 'past' : day.highPriority ? 'priority' : ''}">
            <div class="day-top">
              <div>
                <span class="day-date">${day.date}</span>
                <h2 class="city-name">📍 ${day.city}</h2>
              </div>
              <div class="day-pill ${isToday ? 'today' : isDone ? 'past' : day.highPriority ? 'priority' : ''}">${dayTypeLabel}</div>
            </div>

            <div class="weather-block">
              <div class="weather-head">Weather</div>
              ${weatherBlock}
            </div>

            <div class="trip-meta">
              <div class="hotel-row">
                <div>🏨 ${day.hotel}</div>
                <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="map-button">📍 View Map</a>
              </div>
              <div class="drive-row">🚗 ${day.drive}</div>
            </div>

            ${renderActivities(day)}

            ${day.scenic ? `
              <div class="scenic"><strong style="color: var(--accent);">🌄 Scenic Route:</strong> ${day.scenic}</div>
            ` : ''}

            ${day.alert ? `
              <div class="alert"><strong>⚠️</strong> ${day.alert}</div>
            ` : ''}

            <div class="notes-box">
              <label for="note-${day.id}" class="notes-label" onclick="toggleNotes('${day.id}')">✏️ Notes</label>
              <textarea id="note-${day.id}" rows="3" 
                        class="notes-input ${day.notes ? '' : 'hidden'}" 
                        placeholder="Add notes for this day...">${day.notes}</textarea>
            </div>
          </div>
        `;
      }).join('');

      const pct = Math.round((completedCount / itinerary.length) * 100);
      document.getElementById("progress-bar").style.width = pct + "%";
      document.getElementById("progress-text").innerText = pct + "% Done";
      renderNextUpBanner();
    }

    document.addEventListener('click', (event) => {
      const toggle = event.target.closest('[data-forecast-toggle]');
      if (!toggle) return;

      const id = toggle.getAttribute('data-forecast-toggle');
      const panel = document.querySelector(`[data-forecast-panel="${id}"]`);
      const chevron = document.querySelector(`[data-forecast-chevron="${id}"]`);

      if (!panel || !chevron) return;

      const isHidden = panel.classList.toggle('hidden');
      chevron.textContent = isHidden ? '▾' : '▴';
    });

    function toggleNotes(dayId) {
      const textarea = document.getElementById(`note-${dayId}`);
      if (textarea) {
        textarea.classList.toggle('hidden');
      }
    }

    render();
    hydrateWeather();
    scrollToCurrentDay();

    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => e.waitUntil(caches.open('v1').then(c => c.addAll(['./']))));
        self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
      `;
      const blob = new Blob([swCode], { type: 'text/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }
  </script>
</body>
</html>
