<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ireland 2026">
  <title>Ireland Trip 2026</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="apple-touch-icon" href="https://fav.farm/🇮🇪">
  <link rel="icon" href="https://fav.farm/🇮🇪">

  <style>
    ::-webkit-scrollbar { display: none; }
    * { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-16 antialiased selection:bg-emerald-500 selection:text-slate-950">

  <!-- Sticky Header -->
  <header class="sticky top-0 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 p-4 shadow-xl z-20">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold text-emerald-400 flex items-center gap-2">
          <span>🇮🇪</span> Ireland 2026
        </h1>
        <p class="text-xs text-slate-400">Sep 4 – Sep 14 • Field Companion</p>
      </div>
      <div class="text-right">
        <span id="progress-text" class="text-xs font-semibold text-emerald-400">0% Done</span>
        <div class="w-20 bg-slate-800 h-1.5 rounded-full mt-1 overflow-hidden border border-slate-700">
          <div id="progress-bar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- App Cards -->
  <main class="p-4 max-w-md mx-auto space-y-4" id="app"></main>

  <script>
    const itinerary = [
      {
        id: "sep4",
        date: "Fri, Sep 4",
        city: "Dublin",
        hotel: "Schoolhouse Hotel",
        drive: "Airport Arrival -> Hotel",
        activities: "Arrive morning. Book of Kells, Guinness Storehouse, Jameson Distillery Bow St., St. Stephen's Green.",
        alert: "Required: Reserve tickets for Book of Kells, Kilmainham Gaol, Guinness, & Jameson in advance.",
        highPriority: true
      },
      {
        id: "sep5",
        date: "Sat, Sep 5",
        city: "Dublin",
        hotel: "Schoolhouse Hotel",
        drive: "In & around Dublin",
        activities: "Continue Dublin sights & St. Stephen's Green. Vigil Mass: St. Finian (5:30 PM) or St. Comgille (6:30 PM).",
        alert: "Space out reserved attraction times carefully today.",
        highPriority: true
      },
      {
        id: "sep6",
        date: "Sun, Sep 6",
        city: "Enniskillen",
        hotel: "Enniskillen Hotel",
        drive: "Dublin -> Enniskillen (~2h 15m)",
        activities: "Drive to Enniskillen. Mass at St. Michael's. Detour through North Leitrim (Kelly ancestry).",
        scenic: "Trim Castle & Hill of Tara.",
        highPriority: false
      },
      {
        id: "sep7",
        date: "Mon, Sep 7",
        city: "Turin Castle",
        hotel: "Turin Castle (Ballinrobe)",
        drive: "Enniskillen -> Westport -> Castle (~3h 30m)",
        activities: "Drive to Westport & area. Photo stop at Croagh Patrick base. Castle Dinner at 7:30 PM.",
        scenic: "Mullaghmore Head, Glencar Waterfall, Yeats Grave (Sligo), Parke's Castle, Knock.",
        highPriority: true
      },
      {
        id: "sep8",
        date: "Tue, Sep 8",
        city: "Turin Castle",
        hotel: "Turin Castle (Ballinrobe)",
        drive: "Connemara Loop (~2h 30m total)",
        activities: "Day trip: Clifden, Sky Road scenic loop, Connemara, Kylemore Abbey, Doo Lough Valley.",
        scenic: "Sky Road scenic loop near Clifden for coastal views.",
        highPriority: false
      },
      {
        id: "sep9",
        date: "Wed, Sep 9",
        city: "Adare / Limerick",
        hotel: "Dunraven Arms Hotel",
        drive: "Turin Castle -> Adare via Burren (~2h 30m)",
        activities: "Drive to Adare via The Burren. Explore area.",
        scenic: "Poulnabrone Dolmen (ancient Neolithic limestone tomb).",
        highPriority: false
      },
      {
        id: "sep10",
        date: "Thu, Sep 10",
        city: "Dingle",
        hotel: "Greenmount House B&B",
        drive: "Adare -> Dingle Peninsula (~2h)",
        activities: "Drive via Connor Pass & Slea Head Loop. Killarney National Park (Ladies View & Molls Gap).",
        scenic: "Slea Head: Dingle Crystal, baby lamb farm, Blasket Centre, Gallarus Oratory.",
        highPriority: true
      },
      {
        id: "sep11",
        date: "Fri, Sep 11",
        city: "Dingle",
        hotel: "Greenmount House B&B",
        drive: "Ring of Kerry / Killarney Loop",
        activities: "Option A: Drive Ring of Kerry (Molls Gap, Ladies View).\nOption B: Relaxed Killarney day (Ross Castle, Muckross House).",
        scenic: "Ross Castle or Muckross House & Gardens.",
        highPriority: false
      },
      {
        id: "sep12",
        date: "Sat, Sep 12",
        city: "Dublin",
        hotel: "Premier Inn Dublin Airport",
        drive: "Dingle -> Cashel (3h) -> Dublin (2h)",
        activities: "Drive to Dublin via Rock of Cashel & Glendalough. Vigil Mass in Dublin (St. Finian 5:30 / St. Comgille 6:30).",
        alert: "Essential Stop: Rock of Cashel.",
        highPriority: true
      },
      {
        id: "sep13",
        date: "Sun, Sep 13",
        city: "Dublin / Depart",
        hotel: "Premier Inn (Jane & Steve)",
        drive: "Airport Shuttle / NE Coast",
        activities: "Morning Flights: Brian/Becca, Mary/Doug.\nNE Coast Tour / Brú na Bóinne for Jane & Steve.",
        alert: "Free Premier Inn airport shuttle.",
        highPriority: true
      },
      {
        id: "sep14",
        date: "Mon, Sep 14",
        city: "Departure",
        hotel: "Dublin Airport",
        drive: "Airport Shuttle",
        activities: "Afternoon Flights: Jane & Steve.",
        alert: "Free Premier Inn airport shuttle.",
        highPriority: false
      }
    ];

    function render() {
      const container = document.getElementById("app");
      const savedStates = JSON.parse(localStorage.getItem("ireland_2026_progress") || "{}");
      let completedCount = 0;

      container.innerHTML = itinerary.map((day) => {
        const isDone = !!savedStates[day.id];
        if (isDone) completedCount++;

        return `
          <div class="bg-slate-900 rounded-2xl p-4 border ${isDone ? 'border-slate-800 opacity-60' : day.highPriority ? 'border-amber-500/40' : 'border-slate-800'} shadow-lg transition-all space-y-3">
            <div class="flex justify-between items-start border-b border-slate-800 pb-2.5">
              <div>
                <span class="text-xs font-bold text-emerald-400 tracking-wide uppercase">${day.date}</span>
                <h2 class="text-base font-bold text-slate-100 flex items-center gap-1.5 mt-0.5">
                  📍 ${day.city}
                </h2>
              </div>
              <label class="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700 cursor-pointer active:scale-95 transition">
                <input type="checkbox" ${isDone ? "checked" : ""} onchange="toggleDay('${day.id}')" class="accent-emerald-500 rounded h-4 w-4">
                <span class="text-xs font-medium text-slate-300">${isDone ? "Done" : "Mark"}</span>
              </label>
            </div>

            <div class="grid grid-cols-1 gap-1 text-xs">
              <div class="text-emerald-300/90 font-medium flex items-center gap-1.5">🏨 <span>${day.hotel}</span></div>
              <div class="text-slate-400 flex items-center gap-1.5">🚗 <span>${day.drive}</span></div>
            </div>

            <div class="text-xs text-slate-200 leading-relaxed bg-slate-950/50 p-2.5 rounded-xl border border-slate-800/80">
              ${day.activities.replace(/\n/g, '<br>')}
            </div>

            ${day.scenic ? `<div class="text-xs text-slate-300 bg-slate-800/40 p-2.5 rounded-xl border border-slate-800"><strong class="text-emerald-400 font-semibold">🌄 Scenic Route:</strong> ${day.scenic}</div>` : ''}

            ${day.alert ? `<div class="text-xs bg-amber-950/40 border border-amber-500/30 text-amber-200 p-2.5 rounded-xl flex items-start gap-2"><span>⚠️</span><span>${day.alert}</span></div>` : ''}
          </div>
        `;
      }).join('');

      const pct = Math.round((completedCount / itinerary.length) * 100);
      document.getElementById("progress-bar").style.width = pct + "%";
      document.getElementById("progress-text").innerText = pct + "% Done";
    }

    function toggleDay(id) {
      const savedStates = JSON.parse(localStorage.getItem("ireland_2026_progress") || "{}");
      savedStates[id] = !savedStates[id];
      localStorage.setItem("ireland_2026_progress", JSON.stringify(savedStates));
      render();
    }

    render();

    // Inline Service Worker for Offline PWA Support
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => e.waitUntil(caches.open('v1').then(c => c.addAll(['./']))));
        self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
      `;
      const blob = new Blob([swCode], { type: 'text/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }
  </script>
</body>
</html>
